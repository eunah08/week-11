<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미니 리액트</title>
    <link rel="stylesheet" href="src/styles/base.css">
    <link rel="stylesheet" href="src/demos/phase_one/styles.css">
    <link rel="stylesheet" href="src/demos/phase_two/styles.css">
  </head>
  <body>
    <main class="phase-one">
      <div class="history-controls">
        <button type="button" id="back-button" data-action="back">← 뒤로가기</button>
        <button type="button" id="forward-button" data-action="forward">앞으로가기 →</button>
        <button type="button" id="patch-button" data-action="patch">Patch</button>
        <span id="history-position"></span>
      </div>
      <p class="edit-guide">이력을 이동하면 Patch를 누르기 전의 편집은 사라져요.</p>
      <p id="error-message" role="alert"></p>

      <section class="area-panel">
        <h2 id="real-area-heading">실제 영역</h2>
        <fieldset id="real-area" aria-labelledby="real-area-heading" disabled></fieldset>
      </section>

      <section class="area-panel">
        <h2>테스트 영역</h2>
        <p class="edit-guide">
          글자를 고치거나, 줄을 추가·삭제하거나, 굵게(Ctrl+B) 등 서식을 바꾼 뒤 Patch를 누르세요.
          체크박스도 바꿀 수 있어요. 카드 안에서 편집하고 가장 바깥 카드는 유지해 주세요.
        </p>
        <div id="test-area"></div>
      </section>
    </main>

    <main class="phase-two">
      <h1>Phase 2 : 할 일 목록</h1>
      <p class="error-text" data-role="todo-error" role="alert"></p>
      <div data-role="todo-root"></div>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
